<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girl Hub | العروض</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ===== عروض Girl Hub — Slider مستقل ===== */
.gh-offers-wrap{padding:28px 0 70px;overflow:hidden}
.gh-offers-slider{position:relative;outline:none}
.gh-offers-viewport{overflow:hidden;width:100%;touch-action:pan-y;cursor:grab}
.gh-offers-viewport.is-dragging{cursor:grabbing}
.gh-offers-track{display:flex;gap:14px;direction:ltr;will-change:transform;transform:translate3d(0,0,0)}
.gh-offer-card{flex:0 0 calc((100% - 42px)/4);min-width:0;background:#fff;border:1px solid rgba(120,80,90,.08);border-radius:16px;overflow:hidden;direction:rtl;text-align:right;box-shadow:0 7px 24px rgba(70,40,50,.07);transition:transform .28s ease,box-shadow .28s ease}
.gh-offer-card:hover{transform:translateY(-3px);box-shadow:0 11px 28px rgba(70,40,50,.10)}
.gh-offer-link{display:block;color:inherit;text-decoration:none}
.gh-offer-media{position:relative;aspect-ratio:4/5;background:#f7efec;overflow:hidden}
.gh-offer-media img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .6s cubic-bezier(.22,.7,.25,1)}
.gh-offer-card:hover .gh-offer-media img{transform:scale(1.025)}
.gh-offer-badge{position:absolute;top:10px;right:10px;background:#8f6266;color:#fff;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800}
.gh-offer-body{padding:12px 13px 15px}
.gh-offer-name{font-size:14px;font-weight:800;line-height:1.7;min-height:48px}
.gh-offer-price{display:flex;align-items:center;gap:9px;margin-top:7px}
.gh-offer-price strong{font-size:14px}
.gh-offer-price del{font-size:11px;color:#a79a9e}
.gh-offer-arrows{display:flex;justify-content:center;gap:9px;margin-top:18px}
.gh-offer-arrows button{width:42px;height:42px;border:1px solid #eadfe2;background:#fff;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;transition:.2s}
.gh-offer-arrows button:hover,.gh-offer-arrows button:focus-visible{background:#8f6266;color:#fff;border-color:#8f6266;outline:none}
.gh-offer-hint{text-align:center;color:#9b8b91;font-size:11px;margin-top:9px}
.gh-offers-empty{padding:55px 20px;text-align:center;background:#fff;border-radius:16px}
@media(max-width:900px){.gh-offer-card{flex-basis:calc((100% - 14px)/2)}}
@media(max-width:600px){
 .gh-offers-wrap{padding:20px 0 55px}
 .gh-offers-track{gap:9px}
 .gh-offer-card{flex-basis:calc((100% - 9px)/2);border-radius:13px}
 .gh-offer-body{padding:9px 9px 12px}
 .gh-offer-name{font-size:11px;min-height:40px}
 .gh-offer-price strong{font-size:11px}.gh-offer-price del{font-size:9px}
 .gh-offer-badge{top:7px;right:7px;font-size:8px;padding:5px 7px}
 .gh-offer-hint{font-size:10px}
}
</style>
</head>
<body>
<main>
 <section class="page-head"><div class="container"><h1>العروض والخصومات</h1><p>فرصتك تشتري قطعك المفضلة بسعر أحلى</p></div></section>
 <section class="section gh-offers-wrap">
  <div class="container">
   <div class="gh-offers-slider" id="ghOffersSlider" tabindex="0" aria-label="عروض المنتجات">
    <div class="gh-offers-viewport" id="offersGrid">
     <div class="gh-offers-track" id="ghOffersTrack"></div>
    </div>
    <div class="gh-offer-arrows" aria-label="تحكم في العروض">
      <button type="button" id="ghOfferNext" aria-label="العرض التالي">‹</button>
      <button type="button" id="ghOfferPrev" aria-label="العرض السابق">›</button>
    </div>
    <div class="gh-offer-hint">اسحب على الموبايل · استخدم الأسهم على اللاب · دوس على أي منتج لفتح تفاصيله</div>
   </div>
  </div>
 </section>
</main>
<div class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/products.js"></script>
<script src="js/store-data.js"></script>
<script src="js/header.js"></script>
<script src="js/page.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
 'use strict';
 let items=[],index=0,timer=null,dragging=false,startX=0,lastX=0,moved=false,ready=false,animating=false,lastKey='';
 const slider=()=>document.getElementById('ghOffersSlider');
 const viewport=()=>document.getElementById('offersGrid');
 const track=()=>document.getElementById('ghOffersTrack');
 const visible=()=>window.innerWidth<=900?2:4;
 const gap=()=>{const t=track();return t?parseFloat(getComputedStyle(t).gap)||0:0};
 const cardWidth=()=>{const c=track()?.querySelector('.gh-offer-card');return c?c.getBoundingClientRect().width:0};
 const step=()=>cardWidth()+gap();
 const pct=p=>Number(p.old)>Number(p.price)?Math.max(1,Math.round((1-Number(p.price)/Number(p.old))*100)):0;
 const escA=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
 const card=p=>`<article class="gh-offer-card"><a class="gh-offer-link" href="product.html?id=${encodeURIComponent(p.id)}" aria-label="${escA(p.name||'منتج')}"><div class="gh-offer-media"><img src="${escA(p.img||'assets/images/logo.png')}" alt="${escA(p.name||'منتج')}" draggable="false">${pct(p)?`<span class="gh-offer-badge">${pct(p)}% خصم</span>`:''}</div><div class="gh-offer-body"><div class="gh-offer-name">${escA(p.name||'منتج')}</div><div class="gh-offer-price"><strong>${Number(p.price||0).toLocaleString('ar-EG')} ج.م</strong>${Number(p.old)>0?`<del>${Number(p.old).toLocaleString('ar-EG')} ج.م</del>`:''}</div></div></a></article>`;
 const getItems=()=>Array.isArray(window.PRODUCTS)?window.PRODUCTS.filter(p=>p.visible!==false&&(p.offer===true||(Number(p.old)>Number(p.price)&&Number(p.price)>0))):[];
 const keyOf=list=>JSON.stringify(list.map(p=>[p.id,p.img,p.name,p.price,p.old,p.visible,p.offer]));
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 const position=(animate=true)=>{const t=track();if(!t)return;t.style.transition=animate?'transform .78s cubic-bezier(.22,.72,.24,1)':'none';t.style.transform=`translate3d(${-index*step()}px,0,0)`};
 const normalize=()=>{const n=items.length;if(!n)return;const min=n,max=n*4;if(index>=max){index-=n*3;position(false)}else if(index<min){index+=n*3;position(false)}};
 const move=(dir=1)=>{if(items.length<2||animating)return;animating=true;index+=dir;position(true);setTimeout(()=>{normalize();animating=false;start()},820)};
 const start=()=>{stop();if(items.length>1)timer=setInterval(()=>move(1),3600)};
 const render=force=>{items=getItems();const key=keyOf(items);if(!force&&ready&&key===lastKey){return;}lastKey=key;stop();const t=track(),v=viewport();if(!t||!v)return;if(!items.length){t.innerHTML='<div class="gh-offers-empty" style="width:100%"><h2>مفيش عروض حالياً</h2><p>تابعي الصفحة عشان العروض الجديدة.</p></div>';t.style.transform='none';ready=false;return;}
   // عدة نسخ متتالية = المنتج اللي يخرج من الشاشة يرجع من الناحية التانية من غير فراغ أو اختفاء.
   t.innerHTML=Array.from({length:7},()=>items.map(card).join('')).join('');
   index=items.length*3;position(false);ready=true;start();
 };
 const onDown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const v=viewport();if(!v||items.length<2)return;stop();dragging=true;moved=false;startX=lastX=e.clientX;v.classList.add('is-dragging');track().style.transition='none'};
 const onMove=e=>{if(!dragging)return;const dx=e.clientX-startX;if(Math.abs(dx)>7)moved=true;lastX=e.clientX;track().style.transform=`translate3d(${-index*step()+dx*.95}px,0,0)`};
 const onUp=()=>{if(!dragging)return;dragging=false;viewport().classList.remove('is-dragging');const dx=lastX-startX;if(Math.abs(dx)>40)move(dx<0?1:-1);else{position(true);setTimeout(start,820)}};
 const bind=()=>{const v=viewport(),s=slider();if(!v||!s)return;
   v.addEventListener('pointerdown',onDown,{passive:true});v.addEventListener('pointermove',onMove,{passive:true});v.addEventListener('pointerup',onUp,{passive:true});v.addEventListener('pointercancel',onUp,{passive:true});
   document.getElementById('ghOfferNext')?.addEventListener('click',()=>move(1));document.getElementById('ghOfferPrev')?.addEventListener('click',()=>move(-1));
   s.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(1)}else if(e.key==='ArrowRight'){e.preventDefault();move(-1)}});
   document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start()});
   window.addEventListener('resize',()=>{if(ready){position(false);start()}});
 };
 document.addEventListener('DOMContentLoaded',()=>{bind();render(true)});
 document.addEventListener('girlhub:data-updated',e=>{if(e.detail&&Array.isArray(e.detail.products)){setTimeout(()=>render(false),0)} });
 window.addEventListener('load',()=>setTimeout(()=>render(false),50));
})();
</script>
</body>
</html>
