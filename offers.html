<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girl Hub | العروض</title>
<link rel="stylesheet" href="css/style.css">
<style>
.gh-offers-wrap{padding:28px 0 70px}
.gh-offers-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.gh-offer-card{min-width:0;background:#fff;border:1px solid rgba(120,80,90,.08);border-radius:16px;overflow:hidden;text-align:right;box-shadow:0 7px 24px rgba(70,40,50,.07);transition:transform .25s ease,box-shadow .25s ease}
.gh-offer-card:hover{transform:translateY(-3px);box-shadow:0 11px 28px rgba(70,40,50,.10)}
.gh-offer-link{display:block;color:inherit;text-decoration:none}
.gh-offer-media{position:relative;aspect-ratio:4/5;background:#f7efec;overflow:hidden}
.gh-offer-media img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .5s ease}
.gh-offer-card:hover .gh-offer-media img{transform:scale(1.025)}
.gh-offer-badge{position:absolute;top:10px;right:10px;background:#8f6266;color:#fff;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800}
.gh-offer-body{padding:12px 13px 15px}.gh-offer-name{font-size:14px;font-weight:800;line-height:1.7;min-height:48px}
.gh-offer-price{display:flex;align-items:center;gap:9px;margin-top:7px}.gh-offer-price strong{font-size:14px}.gh-offer-price del{font-size:11px;color:#a79a9e}
.gh-offers-empty{grid-column:1/-1;padding:55px 20px;text-align:center;background:#fff;border-radius:16px}
@media(max-width:1000px){.gh-offers-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(max-width:680px){.gh-offers-wrap{padding:20px 0 55px}.gh-offers-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gh-offer-card{border-radius:13px}.gh-offer-body{padding:9px 9px 12px}.gh-offer-name{font-size:12px;min-height:40px}.gh-offer-price strong{font-size:12px}.gh-offer-price del{font-size:10px}.gh-offer-badge{top:7px;right:7px;font-size:8px;padding:5px 7px}}
</style>
</head>
<body>
<main>
 <section class="page-head"><div class="container"><h1>العروض والخصومات</h1><p>فرصتك تشتري قطعك المفضلة بسعر أحلى</p></div></section>
 <section class="section gh-offers-wrap">
  <div class="container">
   <div class="gh-offers-grid" id="offersGrid" aria-label="عروض المنتجات"></div>
  </div>
 </section>
</main>
<div class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/products.js"></script>
<script src="js/store-data.js"></script>
<script src="js/header.js"></script>
<script src="js/page.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
 'use strict';
 const grid=()=>document.getElementById('offersGrid');
 const pct=p=>Number(p.old)>Number(p.price)&&Number(p.old)>0?Math.max(1,Math.round((1-Number(p.price)/Number(p.old))*100)):0;
 const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const card=p=>`<article class="gh-offer-card"><a class="gh-offer-link" href="product.html?id=${encodeURIComponent(p.id)}" aria-label="${esc(p.name||'منتج')}"><div class="gh-offer-media"><img src="${esc(p.img||'assets/images/logo.png')}" alt="${esc(p.name||'منتج')}" loading="lazy">${pct(p)?`<span class="gh-offer-badge">${pct(p)}% خصم</span>`:''}</div><div class="gh-offer-body"><div class="gh-offer-name">${esc(p.name||'منتج')}</div><div class="gh-offer-price"><strong>${Number(p.price||0).toLocaleString('ar-EG')} ج.م</strong>${Number(p.old)>Number(p.price)?`<del>${Number(p.old).toLocaleString('ar-EG')} ج.م</del>`:''}</div></div></a></article>`;
 const render=()=>{const g=grid();if(!g)return;const products=(typeof PRODUCTS!=='undefined'&&Array.isArray(PRODUCTS)?PRODUCTS:[]).filter(p=>p.visible!==false&&(p.offer===true||(Number(p.old)>Number(p.price)&&Number(p.price)>0)));g.innerHTML=products.length?products.map(card).join(''):'<div class="gh-offers-empty"><h2>مفيش عروض حالياً</h2><p>تابعي الصفحة عشان العروض الجديدة.</p></div>';};
 document.addEventListener('DOMContentLoaded',render);
 document.addEventListener('girlhub:data-updated',e=>{if(e.detail&&Array.isArray(e.detail.products))render()});
 window.addEventListener('load',()=>setTimeout(render,80));
})();
</script>
</body>
</html>
