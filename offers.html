<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Girl Hub | العروض</title><link rel="stylesheet" href="css/style.css"></head><body><main><section class="page-head"><div class="container"><h1>العروض والخصومات</h1><p>فرصتك تشتري قطعك المفضلة بسعر أحلى</p></div></section><section class="section"><div class="container"><div class="products product-grid" id="offersGrid"></div></div></section></main><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/products.js"></script><script src="js/store-data.js"></script><script src="js/header.js"></script><script src="js/page.js"></script><script src="js/main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const renderOffers=()=>{const g=document.querySelector('#offersGrid');if(!g)return;const items=PRODUCTS.filter(p=>p.visible!==false&&p.offer===true);g.innerHTML=items.length?items.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><div class="emoji">％</div><h2>مفيش عروض حالياً</h2><p>تابعي الصفحة عشان العروض الجديدة.</p></div>`;g.querySelectorAll('a[href*="product.html?id="]').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));};renderOffers();document.addEventListener('girlhub:data-updated',renderOffers);})</script></body></html>
