<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girl Hub | الرئيسية</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="figma-home">
<main>
  <section class="gh-hero" aria-label="الجديد من Girl Hub">
    <div class="gh-hero-slide is-active"><img class="gh-hero-bg" src="assets/images/hero2.jpg" alt="مجموعة Girl Hub الجديدة"></div>
    <div class="gh-hero-slide"><img class="gh-hero-bg" src="assets/images/hero2.jpg" alt="تشكيلة ملابس Girl Hub"></div>
    <div class="gh-hero-shade"></div>
    <div class="gh-hero-content">
      <div class="gh-hero-eyebrow">NEW COLLECTION / ٢٠٢٦</div>
      <h1>الجديد منووو</h1>
      <p>تألقي بمظهر فريد يجمع بين الأصالة الكلاسيكية والجرأة العصرية المصممة خصيصًا لك.</p>
      <a class="gh-hero-btn" href="new-products.html">تسوق الآن <span>←</span></a>
    </div>
    <div class="gh-hero-dots" aria-label="تبديل صور الهيرو"><i class="active"></i><i></i></div>
    <button class="gh-hero-nav gh-hero-prev" type="button" aria-label="الصورة السابقة">‹</button>
    <button class="gh-hero-nav gh-hero-next" type="button" aria-label="الصورة التالية">›</button>
  </section>

  <section class="discounts-section">
    <div class="discounts-head">
      <h2>خصومات</h2>
      <a href="offers.html">عرض الكل ←</a>
    </div>
    <div class="slider-arrows">
      <button type="button" class="discount-prev" aria-label="السابق">←</button>
      <button type="button" class="discount-next" aria-label="التالي">→</button>
    </div>
    <div class="discount-viewport">
      <div class="discount-grid" id="discountGrid"></div>
    </div>
  </section>

  <section class="choose-section">
    <h2>عايزه إيه؟</h2><div class="choose-underline"></div>
    <div class="choose-grid">
      <a href="accessories.html" class="choose-card gh-reveal">
        <img src="assets/images/bag.jpg" alt="إكسسوارات">
        <span class="choose-shade"></span>
        <span class="choose-content"><strong>إكسسوارات</strong><small>اكتشفي تشكيلتنا</small><b>تسوقي الآن ←</b></span>
      </a>
      <a href="clothes.html" class="choose-card gh-reveal">
        <img src="assets/images/dress.jpg" alt="ملابس">
        <span class="choose-shade"></span>
        <span class="choose-content"><strong>ملابس</strong><small>اختاري إطلالتك</small><b>تسوقي الآن ←</b></span>
      </a>
    </div>
  </section>
</main>
<div class="toast"></div>
<script src="js/products.js"></script><script src="js/header.js"></script><script src="js/page.js"></script><script src="js/main.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{const hero=document.querySelector('.gh-hero');if(!hero)return;hero.classList.add('loaded');const slides=[...hero.querySelectorAll('.gh-hero-slide')],dots=[...hero.querySelectorAll('.gh-hero-dots i')];let i=0,timer;const go=n=>{i=(n+slides.length)%slides.length;slides.forEach((s,k)=>s.classList.toggle('is-active',k===i));dots.forEach((d,k)=>d.classList.toggle('active',k===i));hero.classList.remove('hero-pulse');void hero.offsetWidth;hero.classList.add('hero-pulse')};const restart=()=>{clearInterval(timer);timer=setInterval(()=>go(i+1),6000)};hero.querySelector('.gh-hero-next')?.addEventListener('click',()=>{go(i+1);restart()});hero.querySelector('.gh-hero-prev')?.addEventListener('click',()=>{go(i-1);restart()});dots.forEach((d,k)=>d.addEventListener('click',()=>{go(k);restart()}));go(0);restart()});</script>
</body></html>
