<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Girl Hub | الدفع</title><link rel="stylesheet" href="css/style.css"></head><body><main><section class="page-head"><div class="container"><h1>إتمام الطلب</h1><p>اكتبي بيانات الشحن والدفع</p></div></section><section class="checkout container"><form class="formbox" id="checkoutForm"><h3>بيانات العميل</h3><div class="field"><label>الاسم بالكامل</label><input id="customerName" name="customerName" required></div><div class="field"><label>رقم الهاتف</label><input id="customerPhone" name="customerPhone" required type="tel"></div><div class="field"><label>المحافظة</label><select id="governorate" name="governorate" required><option value="">اختاري المحافظة</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>القليوبية</option><option>الدقهلية</option><option>الشرقية</option><option>الغربية</option><option>المنوفية</option><option>البحيرة</option><option>كفر الشيخ</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>بني سويف</option><option>الفيوم</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>الوادي الجديد</option><option>مطروح</option></select></div><div class="field"><label>العنوان بالتفصيل</label><textarea id="address" name="address" required></textarea></div><div class="field"><label>طريقة الدفع</label><select id="paymentMethod" name="paymentMethod" required><option value="">اختاري طريقة الدفع</option><option value="الدفع عند الاستلام">الدفع عند الاستلام</option><option value="كاش">كاش</option><option value="انستا باي">انستا باي</option></select><div id="paymentNote" class="payment-note" hidden>هنكلمك بعد تأكيد الطلب بخصوص إتمام عملية الدفع وتأكيد التفاصيل.</div></div><button class="btn" type="submit">تأكيد الطلب</button></form><aside class="summary"><h3>ملخص الطلب</h3><div class="checkout-items"></div><div class="sumline total"><span>الإجمالي شامل الشحن</span><strong class="checkout-total">0</strong></div></aside></section></main><div class="toast"></div><script src="js/products.js"></script><script src="js/header.js"></script><script src="js/page.js"></script><script src="js/main.js"></script></body></html>
